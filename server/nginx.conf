# nginx.conf — Reverse proxy for IGI FastAPI backend
# Place at:   /etc/nginx/sites-available/igi
# Enable:     ln -s /etc/nginx/sites-available/igi /etc/nginx/sites-enabled/igi
# Test:       nginx -t
# Reload:     systemctl reload nginx

upstream igi_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name api.igi.org.pe www.api.igi.org.pe;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.igi.org.pe www.api.igi.org.pe;

    ssl_certificate     /etc/letsencrypt/live/api.igi.org.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.igi.org.pe/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer-when-downgrade;

    # Upload size cap — rejects oversized requests BEFORE they reach Python.
    # Python middleware (main.py) is a second layer for chunked transfers.
    client_max_body_size 100M;

    # Timeouts matching Gunicorn worker timeout
    proxy_read_timeout    120s;
    proxy_send_timeout    120s;
    proxy_connect_timeout 10s;

    # Proxy headers
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # -------------------------------------------------------
    # [Issue #8 FIX] Static files served by Nginx directly.
    # Python StaticFiles mounts REMOVED from main.py.
    # Every image served through Python consumed ~5 ms of CPU
    # per request (CORS + rate-limit + StaticFiles middleware).
    # Nginx serves the same file in ~0.1 ms with zero Python CPU.
    # On a page loading 20 images: 100 ms Python CPU → 2 ms Nginx.
    #
    # Cache headers: 7-day immutable cache cuts repeat fetches.
    # access_log off: eliminates log I/O for high-volume image GETs.
    # -------------------------------------------------------
    location /files/ {
        alias /srv/igi/output/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /uploads/ {
        alias /srv/igi/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /mini-reports/ {
        alias /srv/igi/mini-reports-output/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # API — proxy everything else to Gunicorn
    location / {
        proxy_pass http://igi_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";   # enable upstream keep-alive
    }
}
